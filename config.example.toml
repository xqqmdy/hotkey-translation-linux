# hotkey-translation config.
# Copy to ~/.config/hotkey-translation/config.toml (mode 600) and fill the key.
# Get a key at https://openrouter.ai/keys . Env OPENROUTER_API_KEY overrides this file.

openrouter_api_key = "PASTE_YOUR_KEY_HERE"

# Translation direction. Any code the model understands works; common ones are
# mapped to full names for the prompt (zh, en, ja, ko, fr, de, es, ru, ...).
source_lang = "zh"
target_lang = "en"

# Optional pinned model. Leave unset/empty to follow the last pick, falling
# back to the first live free model. There is no curated list: the picker
# (hotkey-translation --pick) fetches the current free models from OpenRouter.
model = ""

# Seconds to cache the fetched model list. TTL 0 refetches every pick.
models_ttl_secs = 86400

# Request timeout in seconds.
timeout_secs = 30

# Output token budget. Reasoning models count their hidden thinking against
# it, so raise this when a model returns finish_reason=length with no text.
max_tokens = 512

# API base. Leave default; tests override via OPENROUTER_BASE_URL env.
base_url = "https://openrouter.ai/api/v1"
